<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 360" width="1300" height="360" role="img" aria-labelledby="t">
  <title id="t">Open-Gov: Real-time civic transparency portal for economic data and public expenditure.</title>
  <style>
    @keyframes grow1{0%,100%{transform:scaleX(.72)}50%{transform:scaleX(1)}}
    @keyframes grow2{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.68)}}
    .g1{transform-box:fill-box;transform-origin:left center;animation:grow1 4.2s ease-in-out infinite}
    .g2{transform-box:fill-box;transform-origin:left center;animation:grow2 4.2s ease-in-out infinite}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
    .bob{animation:bob 3.8s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
    .pulse{animation:pulse 1.8s ease-in-out infinite}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <defs>
    <clipPath id="c"><rect width="1300" height="360" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect x="500" width="800" height="360" fill="#0D2B2B"/>
    <path d="M500 0V360M522 0V360M544 0V360M566 0V360M588 0V360M610 0V360M632 0V360M654 0V360M676 0V360M698 0V360M720 0V360M742 0V360M764 0V360M786 0V360M808 0V360M830 0V360M852 0V360M874 0V360M896 0V360M918 0V360M940 0V360M962 0V360M984 0V360M1006 0V360M1028 0V360M1050 0V360M1072 0V360M1094 0V360M1116 0V360M1138 0V360M1160 0V360M1182 0V360M1204 0V360M1226 0V360M1248 0V360M1270 0V360M1292 0V360M500 0H1300M500 22H1300M500 44H1300M500 66H1300M500 88H1300M500 110H1300M500 132H1300M500 154H1300M500 176H1300M500 198H1300M500 220H1300M500 242H1300M500 264H1300M500 286H1300M500 308H1300M500 330H1300M500 352H1300" stroke="rgba(255,255,255,.05)" stroke-width="1"/>
    
    <rect width="500" height="360" fill="#F4EDE1"/>
    <text x="40" y="52" fill="#0F4C4C" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="1.2">02 · CIVIC TRANSPARENCY</text>
    <text x="40" y="114" fill="#16181B" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-1.2">Open-Gov</text>
    <text x="40" y="164" fill="#2D333B" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18.5" font-weight="600">Real-time transparency portal for</text>
    <text x="40" y="194" fill="#2D333B" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18.5" font-weight="600" opacity=".88">national economic &amp; fiscal data.</text>
    <line x1="40" y1="258" x2="460" y2="258" stroke="rgba(22,24,27,.14)" stroke-width="1"/>
    <text x="40" y="308" fill="#16181B" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="800" letter-spacing="-0.6">100%</text><text x="40" y="331" fill="#5A636E" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5" font-weight="600">Open Public Data</text><text x="205" y="308" fill="#16181B" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="800" letter-spacing="-0.6">Next.js</text><text x="205" y="331" fill="#5A636E" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5" font-weight="600">TypeScript</text><text x="345" y="308" fill="#16181B" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="800" letter-spacing="-0.6">Live</text><text x="345" y="331" fill="#5A636E" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5" font-weight="600">Fiscal Metrics</text>
    

    <!-- Main Dashboard Window -->
    <rect x="540" y="30" width="720" height="300" rx="16" fill="#091E1E" stroke="rgba(52,211,153,.28)"/>
    <circle cx="566" cy="54" r="5" fill="#EF4444"/>
    <circle cx="584" cy="54" r="5" fill="#F59E0B"/>
    <circle cx="602" cy="54" r="5" fill="#34D399"/>
    <text x="626" y="59" fill="#A7F3D0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="600">open-gov-swart.vercel.app // CIVIC LEDGER</text>
    <circle class="pulse" cx="1164" cy="54" r="4.5" fill="#34D399"/>
    <text x="1176" y="59" fill="#34D399" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="700">VERIFIED</text>

    <!-- Three KPI Cards -->
    <g class="bob">
      <rect x="564" y="82" width="212" height="76" rx="10" fill="#103636" stroke="rgba(255,255,255,.08)"/>
      <text x="580" y="106" fill="#8CC4B8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5">DEVELOPMENT PROJECTS</text>
      <text x="580" y="140" fill="#F4F1E8" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="800">Tracked Live</text>

      <rect x="794" y="82" width="212" height="76" rx="10" fill="#103636" stroke="rgba(255,255,255,.08)"/>
      <text x="810" y="106" fill="#8CC4B8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5">PUBLIC EXPENDITURE</text>
      <text x="810" y="140" fill="#34D399" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="800">Auditable</text>

      <rect x="1024" y="82" width="212" height="76" rx="10" fill="#103636" stroke="rgba(255,255,255,.08)"/>
      <text x="1040" y="106" fill="#8CC4B8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5">OPEN DATASETS</text>
      <text x="1040" y="140" fill="#D4B064" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="800">Sri Lanka</text>
    </g>

    <!-- Animated Allocation Bars -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5">
      <text x="566" y="196" fill="#E6E9EE">INFRASTRUCTURE &amp; TRANSIT</text>
      <rect x="780" y="184" width="456" height="14" rx="7" fill="rgba(255,255,255,.08)"/>
      <rect class="g1" x="780" y="184" width="380" height="14" rx="7" fill="#34D399"/>

      <text x="566" y="234" fill="#E6E9EE">EDUCATION &amp; RESEARCH</text>
      <rect x="780" y="222" width="456" height="14" rx="7" fill="rgba(255,255,255,.08)"/>
      <rect class="g2" x="780" y="222" width="320" height="14" rx="7" fill="#D4B064"/>

      <text x="566" y="272" fill="#E6E9EE">HEALTHCARE &amp; CIVIC OPS</text>
      <rect x="780" y="260" width="456" height="14" rx="7" fill="rgba(255,255,255,.08)"/>
      <rect class="g1" x="780" y="260" width="290" height="14" rx="7" fill="#60A5FA"/>

      <text x="566" y="308" fill="#8CC4B8">SOURCE: PUBLIC TREASURY &amp; CIVIC PORTAL METRICS · NEXT.JS + TS</text>
    </g>
  </g>
  <rect x=".5" y=".5" width="1299" height="359" rx="19.5" fill="none" stroke="rgba(255,255,255,.14)"/>
</svg>