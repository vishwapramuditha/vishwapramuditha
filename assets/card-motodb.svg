    <path class="lap" d="M582 238 C562 238 558 192 586 172 L646 132 C666 118 666 96 694 92 L790 82 C840 78 874 106 868 142 C862 174 822 182 812 204 C804 224 844 236 838 266 C832 292 786 296 742 284 L662 262 C628 252 606 238 582 238 Z"
          fill="none" stroke="#00D2BE" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="694" cy="92" r="5" fill="#E10600"/>
    <circle cx="812" cy="204" r="5" fill="#F2CF1D"/>
    <text x="560" y="312" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5">S1 PURPLE · S2 GREEN · DRIVERS &amp; TRACKS</text>

    <!-- Timing Tower Panel -->
    <rect x="938" y="28" width="326" height="304" rx="16" fill="#0E1117" stroke="rgba(255,255,255,.1)"/>
    <text x="960" y="59" fill="#00D2BE" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="700">SERIES // LIVE INDEX</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13">
      <rect x="960" y="82" width="282" height="44" rx="8" fill="#161B22"/>
      <rect x="960" y="82" width="4" height="44" rx="2" fill="#E10600"/>
      <text x="976" y="109" fill="#F4F1E8" font-weight="700">F1</text>
      <text x="1026" y="109" fill="#A7ADB6">24 Rounds · Telemetry</text>
      <rect class="bar" x="1202" y="99" width="28" height="8" rx="4" fill="#E10600"/>

      <rect x="960" y="138" width="282" height="44" rx="8" fill="#161B22"/>
      <rect x="960" y="138" width="4" height="44" rx="2" fill="#FE6B3D"/>
