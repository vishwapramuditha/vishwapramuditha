      <rect x="960" y="194" width="282" height="44" rx="8" fill="#161B22"/>
      <rect x="960" y="194" width="4" height="44" rx="2" fill="#00D2BE"/>
      <text x="976" y="221" fill="#F4F1E8" font-weight="700">IndyCar</text>
      <text x="1048" y="221" fill="#A7ADB6">Circuits &amp; Standings</text>
      <rect class="bar b3" x="1202" y="211" width="28" height="8" rx="4" fill="#00D2BE"/>

      <rect x="960" y="250" width="282" height="44" rx="8" fill="#161B22"/>
      <rect x="960" y="250" width="4" height="44" rx="2" fill="#F2CF1D"/>
      <text x="976" y="277" fill="#F4F1E8" font-weight="700">WEC</text>
      <text x="1026" y="277" fill="#A7ADB6">Endurance Data</text>
      <rect class="bar b4" x="1202" y="267" width="28" height="8" rx="4" fill="#F2CF1D"/>
