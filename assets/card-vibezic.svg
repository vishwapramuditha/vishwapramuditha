    <text x="40" y="114" fill="#FFFFFF" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-1.2">VibeZic</text>
    <text x="40" y="164" fill="#DBEAFE" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18.5" font-weight="600">Real-time offline security scanner</text>
    <text x="40" y="194" fill="#DBEAFE" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18.5" font-weight="600" opacity=".88">for AI &amp; vibe-coded repositories.</text>
    <line x1="40" y1="258" x2="460" y2="258" stroke="rgba(255,255,255,.22)" stroke-width="1"/>
