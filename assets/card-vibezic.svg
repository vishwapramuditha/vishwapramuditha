        <rect x="980" y="206" width="264" height="50" rx="8" fill="#161E2E"/>
        <rect x="980" y="206" width="4" height="50" rx="2" fill="#38BDF8"/>
        <text x="996" y="227" fill="#7DD3FC" font-weight="700">HIGH · VZ-060</text>
