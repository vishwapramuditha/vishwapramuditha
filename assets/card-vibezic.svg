      <text x="996" y="294" fill="#E0F2FE" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="700">OWASP · CWE · NIST · ZERO KEYS</text>
