<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 360" width="1300" height="360" role="img" aria-labelledby="t">
  <title id="t">VibeZic: Real-time offline VS Code security vulnerability and bug scanner for vibe-coded projects.</title>
  <style>
    @keyframes sweep{0%{transform:translateY(0);opacity:0}15%{opacity:.85}85%{opacity:.85}100%{transform:translateY(210px);opacity:0}}
    .sweep{animation:sweep 3.8s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
    .pulse{animation:pulse 1.5s ease-in-out infinite}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
    .bob{animation:bob 4s ease-in-out infinite}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <defs>
