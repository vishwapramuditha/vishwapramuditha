      <text x="572" y="242" fill="#38BDF8" font-size="12" font-weight="700">REMEDIATION // A03:2021</text>
      <text x="572" y="266" fill="#34D399" font-size="12">cur.execute("... WHERE id = %s",</text>
      <text x="572" y="288" fill="#34D399" font-size="12">            (uid,))</text>
    </g>

