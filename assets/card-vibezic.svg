      <text x="590" y="129" fill="#FCA5A5" font-size="11.5" font-weight="700">VZ-002 · SQL Injection (CWE-89)</text>

      <text x="556" y="158" fill="#64748B">2</text>
      <text x="580" y="158" fill="#F4F1E8">  cur.execute(<tspan fill="#FCA5A5">f"SELECT * {uid}"</tspan>)</text>
      <path d="M674 164 q4 -3 8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0" fill="none" stroke="#EF4444" stroke-width="2"/>

      <text x="556" y="194" fill="#64748B">3</text>
      <text x="580" y="194" fill="#64748B"># Hover: Use parameterized query</text>

